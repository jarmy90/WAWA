# Perfil AISLADO y OPCIONAL para OmniRoute (iteración 008).
#
# NO se arranca con el proyecto por defecto. Solo para pruebas controladas:
#   docker compose -f infra/omniroute/docker-compose.omniroute.yml up -d
#
# Reglas de aislamiento:
#   - Puerto enlazado SOLO a 127.0.0.1 (nunca 0.0.0.0).
#   - Versión FIJADA (no "latest"): 3.8.50 (la analizada en la iteración 008).
#   - Contenedor sin privilegios, filesystem de solo lectura (read_only).
#   - Sin socket Docker, sin acceso a la red interna de WAWA.
#   - Volúmenes mínimos; secretos vía archivo .env.omniroute FUERA del repo.
#   - Healthcheck, restart policy y límites de CPU/memoria.
#   - Logs rotativos.
#
# NOTA: el archivo .env.omniroute NO existe en el repositorio. Crea uno junto a
# este perfil con las variables que OmniRoute necesite (nunca claves reales en Git).

services:
  omniroute:
    image: omniroute:3.8.50
    container_name: omniroute-abl
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    env_file:
      - .env.omniroute   # fuera del repositorio (gitignored)
    environment:
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      # Solo permitir orígenes locales (WS de la dashboard).
      LIVE_WS_ALLOWED_ORIGINS: "http://127.0.0.1:20128,http://localhost:20128"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m
    volumes:
      # Mínimo: datos persistentes de OmniRoute (SQLite) + runtime.
      - omniroute-data:/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - omniroute-net

  redis:
    image: redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    read_only: true
    tmpfs:
      - /data:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - omniroute-net

volumes:
  omniroute-data:

networks:
  # Red propia del gateway. NO internal: OmniRoute necesita salida para llegar
  # a los proveedores upstream. El aislamiento real está en el binding
  # 127.0.0.1, la ausencia de socket Docker y la red separada de WAWA.
  omniroute-net:
